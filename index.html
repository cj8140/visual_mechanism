<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Mechanism</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
            font-size: 32px;
        }

        .mechanisms {
            display: grid;
            gap: 20px;
        }

        .mechanism-card {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .mechanism-card:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateX(10px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .mechanism-card .number {
            font-size: 28px;
            font-weight: bold;
            min-width: 50px;
            margin-right: 20px;
            text-align: center;
        }

        .mechanism-card .content h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .mechanism-card .content p {
            font-size: 14px;
            opacity: 0.7;
        }

        .mechanism-card:hover .content p {
            opacity: 1;
            color: rgba(255, 255, 255, 0.9);
        }

        .arrow {
            margin-left: auto;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Visual Mechanism</h1>
        <div class="mechanisms">
            <a href="00_mechanism/01_crank/index.html" class="mechanism-card">
                <div class="number">01</div>
                <div class="content">
                    <h2>Crank Mechanism</h2>
                    <p>회전 운동을 직선 운동으로 변환</p>
                </div>
                <div class="arrow">→</div>
            </a>

            <a href="00_mechanism/02_shifted_circle/index.html" class="mechanism-card">
                <div class="number">02</div>
                <div class="content">
                    <h2>Shifted Circle</h2>
                    <p>원운동의 위치 변화 시뮬레이션</p>
                </div>
                <div class="arrow">→</div>
            </a>

            <a href="00_mechanism/03_four_bar_linkage/index.html" class="mechanism-card">
                <div class="number">03</div>
                <div class="content">
                    <h2>Four-Bar Linkage</h2>
                    <p>4절 링크 기구의 동작 원리</p>
                </div>
                <div class="arrow">→</div>
            </a>
        </div>
    </div>
</body>
</html>
